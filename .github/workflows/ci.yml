# Continuous integration. Needs NO secrets and makes NO model calls: the test
# suite and the evaluation check are deterministic and offline. The live-model
# evaluation (`pnpm eval --live`) is deliberately not run here.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, evaluation check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # keytar (OS keychain) loads libsecret at runtime on Linux.
      - name: Install system library for keytar
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Fails if the committed evaluation results differ from what the code produces now.
      - name: Evaluation check (development and held-out sets)
        run: pnpm eval:check

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - run: pnpm install --frozen-lockfile
      # next build downloads Google Fonts, so it needs outbound network (GitHub-hosted runners have it).
      - run: pnpm build
